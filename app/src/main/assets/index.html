<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>(function(){function f(){var b=document.body;if(!b||!b.children.length)return;var H=window.innerHeight||Math.round(screen.height/(window.devicePixelRatio||1));if(H>0&&b.getBoundingClientRect().height<50){document.documentElement.style.height=H+"px";b.style.height=H+"px"}}window.addEventListener("load",function(){f();setTimeout(f,300);setTimeout(f,1200)});window.addEventListener("resize",f)})()</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساب بلال</title>
<style>
:root{--bg:#fdf6ef;--card:#fff;--line:#d9d4cf;--ink:#1f3a5f;--head:#111;--blue:#5b9bd5;--green:#5aae6a;--red:#d9534f;--muted:#8a8a8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1a17;--card:#2a2622;--line:#4a443e;--ink:#cfe3fa;--head:#f2ece6;--muted:#a69f98}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--head);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px}
input{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
#name{font-size:18px;margin-bottom:14px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;border:1.5px solid var(--line)}
th,td{border:1.5px solid var(--line);padding:8px 6px;text-align:center;vertical-align:middle}
th{font-size:17px;padding:14px 6px}
td.price input{font-weight:700;font-size:20px;text-align:right;direction:ltr}
td.time{font-size:13px;color:var(--muted);line-height:1.5;min-width:86px;direction:ltr}
td.sgn{width:52px}
.sg{background:var(--blue);color:#fff;border:0;border-radius:8px;font-size:20px;font-weight:700;width:40px;height:40px;cursor:pointer}
.add,.share,.clear{display:block;border:0;border-radius:10px;font:inherit;font-size:18px;color:#fff;padding:14px 22px;cursor:pointer}
.add{background:var(--blue);margin:16px 0 0}
#total{font-size:30px;font-weight:700;margin:26px 0;color:var(--green)}
#total.neg{color:var(--red)}
.share{background:var(--green);width:100%;margin-bottom:12px}
.clear{background:transparent;color:var(--red);border:1.5px solid var(--red);width:100%;font-size:16px}
</style>
</head>
<body>
<h1>حساب بلال</h1>
<input id="name" placeholder="ادخل اسم الزبون" value="بلال" aria-label="اسم الزبون">
<div class="wrap">
<table>
<thead><tr><th>الصنف</th><th>الثمن (₪)</th><th>التاريخ والوقت</th><th>±</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<button class="add" id="add">+ إضافة صنف جديد</button>
<div id="total">الإجمالي: 0 شيكل</div>
<button class="share" id="share">📤 مشاركة على واتساب</button>
<button class="clear" id="clear">🗑️ مسح الكل وبدء حساب جديد</button>

<script>
var KEY='bilal_v1', rows=[], tb=document.getElementById('rows');
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){rows=s.rows||[];if(s.name)document.getElementById('name').value=s.name}}catch(e){}
while(rows.length<3)rows.push({item:'',price:'',ts:null})}
function save(){try{localStorage.setItem(KEY,JSON.stringify({rows:rows,name:document.getElementById('name').value}))}catch(e){}}
function fmt(ts){if(!ts)return'';var d=new Date(ts),p=function(n){return String(n).padStart(2,'0')};
return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+'<br>'+p(d.getHours())+':'+p(d.getMinutes())}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function filled(r){return String(r.price).trim()!==''}
function total(){var t=0;rows.forEach(function(r){t+=num(r.price)});t=Math.round(t*100)/100;
var el=document.getElementById('total');el.textContent='الإجمالي: '+t+' شيكل';el.className=t<0?'neg':'';return t}
function addRow(r){
 var tr=document.createElement('tr');
 tr.innerHTML='<td><input type="text" aria-label="الصنف"></td>'+
 '<td class="price"><input type="number" inputmode="decimal" step="any" aria-label="الثمن"></td>'+
 '<td class="time"></td><td class="sgn"><button class="sg" aria-label="تبديل موجب/سالب">±</button></td>';
 var it=tr.querySelector('input[type=text]'),pr=tr.querySelector('input[type=number]'),tm=tr.querySelector('.time'),sg=tr.querySelector('.sg');
 it.value=r.item;pr.value=r.price;tm.innerHTML=fmt(r.ts);
 it.oninput=function(){r.item=it.value;save()};
 pr.oninput=function(){
  r.price=pr.value;
  if(filled(r)&&!r.ts){r.ts=Date.now();tm.innerHTML=fmt(r.ts)}
  if(!filled(r)){r.ts=null;tm.innerHTML=''}
  ensureSpare();total();save()};
 sg.onclick=function(){var v=parseFloat(pr.value);if(isNaN(v))return;pr.value=String(-v);pr.oninput()};
 tb.appendChild(tr)}
function ensureSpare(){if(filled(rows[rows.length-1])){var r={item:'',price:'',ts:null};rows.push(r);addRow(r)}}
document.getElementById('add').onclick=function(){var r={item:'',price:'',ts:null};rows.push(r);addRow(r);save()};
document.getElementById('name').oninput=save;
document.getElementById('share').onclick=function(){
 var n=document.getElementById('name').value||'الزبون',t='حساب '+n+'\n';
 rows.filter(filled).forEach(function(r){var d=new Date(r.ts),p=function(x){return String(x).padStart(2,'0')};
  t+=(r.item?r.item+': ':'')+num(r.price)+' ₪ ('+p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes())+')\n'});
 t+='الإجمالي: '+total()+' شيكل';
 window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')};
document.getElementById('clear').onclick=function(){
 if(!confirm('مسح كل الأصناف وبدء حساب جديد؟'))return;
 rows=[];try{localStorage.removeItem(KEY)}catch(e){}
 tb.innerHTML='';while(rows.length<3)rows.push({item:'',price:'',ts:null});rows.forEach(addRow);total()};
load();rows.forEach(addRow);ensureSpare();total();
</script>
</body>
</html>
