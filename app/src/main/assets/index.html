function files(){

${o.cut?'if(Build.VERSION.SDK_INT>=28){WindowManager.LayoutParams p=win.getAttributes();p.layoutInDisplayCutoutMode=WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;win.setAttributes(p);}':''}

});
w.setWebChromeClient(new WebChromeClient(){
@Override public void onProgressChanged(WebView v,int p){pb.setProgress(p);pb.setVisibility(PROG&&p<100?View.VISIBLE:View.GONE);}
@Override public void onPermissionRequest(PermissionRequest r){runOnUiThread(()->r.grant(r.getResources()));}
@Override public void onGeolocationPermissionsShowPrompt(String og,GeolocationPermissions.Callback c){c.invoke(og,true,false);}

});

w.setDownloadListener((u,ua,cd,mt,ln)->{String fn=URLUtil.guessFileName(u,cd,mt).replace("'","");

else if(u.startsWith("data:"))save(u,fn);
else{DownloadManager.Request q=new DownloadManager.Request(Uri.parse(u));q.setMimeType(mt);String ck=CookieManager.getInstance().getCookie(u);if(ck!=null)q.addRequestHeader("cookie",ck);q.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);q.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,fn);((DownloadManager)getSystemService(DOWNLOAD_SERVICE)).enqueue(q);t("بدأ التنزيل");}});
root.addView(sr,new FrameLayout.LayoutParams(-1,-1));root.addView(pb,new FrameLayout.LayoutParams(-1,12));
setContentView(root);
java.util.ArrayList<String> ps=new java.util.ArrayList<>(java.util.Arrays.asList(new String[]{${dang}}));
if(Build.VERSION.SDK_INT<29)ps.add(Manifest.permission.WRITE_EXTERNAL_STORAGE);
if(Build.VERSION.SDK_INT>=23&&!ps.isEmpty())requestPermissions(ps.toArray(new String[0]),1);
w.post(()->w.loadUrl("file:///android_asset/index.html"));}
void t(String s){runOnUiThread(()->Toast.makeText(this,s,Toast.LENGTH_SHORT).show());}
@JavascriptInterface public void save(String d,String n){try{int i=d.indexOf(',');String m=d.substring(5,d.indexOf(';'));byte[] by=Base64.decode(d.substring(i+1),0);java.io.OutputStream o;

@Override public void onBackPressed(){
if(BACK&&w.canGoBack())w.goBack();
else if(EXIT)new AlertDialog.Builder(this).setMessage("هل تريد الخروج؟").setPositiveButton("نعم",(d,k)->finish()).setNegativeButton("لا",null).show();
else super.onBackPressed();}
}`;
const manifest=`<manifest xmlns:android="http://schemas.android.com/apk/res/android">
${pr.map(p=>'<uses-permission android:name="android.permission.'+p+'"/>').join('\n')}
<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
<application android:label="${esc(n)}" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.Light.${o.bar?'DarkActionBar':'NoActionBar'}" android:usesCleartextTraffic="true" android:enableOnBackInvokedCallback="false">
<activity android:name=".MainActivity" android:exported="true" android:screenOrientation="${v('ori')}" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode">
<intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
</activity></application></manifest>`;
const appg=`plugins { id 'com.android.application' }
android {
  namespace '${pk}'
  compileSdk 35
  defaultConfig { applicationId '${pk}'; minSdk ${v('mn')}; targetSdk ${v('tg')}; versionCode ${v('vc')}; versionName '${v('vn')}' }

const wf=['name: Build APK','on: [push, workflow_dispatch]','permissions:','  contents: write','jobs:','  build:','    runs-on: ubuntu-latest','    steps:','      - uses: actions/checkout@v4','      - uses: actions/setup-java@v4','        with:','          distribution: temurin','          java-version: 17','      - uses: gradle/actions/setup-gradle@v4','        with:','          gradle-version: 8.9','      - run: gradle assembleDebug --no-daemon','      - run: gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "APK ${{ github.run_number }}" --notes build','        env:','          GH_TOKEN: ${{ github.token }}',''].join('\n');
return [
['settings.gradle',`pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositories { google(); mavenCentral() } }\nrootProject.name = 'app'\ninclude ':app'`],
['build.gradle',`plugins { id 'com.android.application' version '8.7.3' apply false }`],
['gradle.properties',`android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g`],
['app/build.gradle',appg],
['app/src/main/AndroidManifest.xml',manifest],
['app/src/main/java/'+pk.replace(/\./g,'/')+'/MainActivity.java',java],
['app/src/main/assets/index.html',inj(html,o.dbg)],
['app/src/main/res/mipmap-xxxhdpi/ic_launcher.png',icon||defIcon(n),1],

let tok='';
async function gh(p,m,b){const r=await fetch('https://api.github.com'+p,{method:m||'GET',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});

$('go').onclick=async()=>{
const pk=v('pk');tok=v('tok');
if(!v('name'))return alert('اكتب اسم التطبيق');
if(!/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(pk))return alert('معرّف الحزمة غير صحيح، مثال: com.myapp.app');

$('go').disabled=true;$('out').style.display='block';$('log').textContent='';$('res').innerHTML='';
try{
const me=await gh('/user');if(!me)throw new Error('التوكن غير صحيح');
const rn=v('repo')||'html2apk-builds',R=me.login+'/'+rn;
let rp=await gh('/repos/'+R);
if(!rp){L('إنشاء المستودع…');rp=await gh('/user/repos','POST',{name:rn,private:!ck('pub'),auto_init:true})}
else if(ck('pub')&&rp.private){L('جعل المستودع عاماً…');try{await gh('/repos/'+R,'PATCH',{private:false});rp.private=false}catch(e){L('تعذر جعله عاماً، سأستخدم التنزيل الخاص')}}
const br=rp.default_branch;let ref=null;
for(let i=0;i<10&&!ref;i++){ref=await gh(`/repos/${R}/git/ref/heads/${br}`);if(!ref)await sleep(1500)}
if(!ref)throw new Error('تعذر قراءة الفرع');
L('رفع الملفات…');const tree=[];
for(const f of files()){const b=await gh(`/repos/${R}/git/blobs`,'POST',{content:f[1],encoding:f[2]?'base64':'utf-8'});tree.push({path:f[0],mode:'100644',type:'blob',sha:b.sha})}
const t=await gh(`/repos/${R}/git/trees`,'POST',{tree});
const c=await gh(`/repos/${R}/git/commits`,'POST',{message:'build',tree:t.sha,parents:[ref.object.sha]});
await gh(`/repos/${R}/git/refs/heads/${br}`,'PATCH',{sha:c.sha,force:true});
L('بدأ البناء، يستغرق عدة دقائق…');
let run=null,last='';
for(let i=0;i<160;i++){await sleep(5000);const d=await gh(`/repos/${R}/actions/runs?head_sha=${c.sha}`);run=d&&d.workflow_runs[0];
if(run){if(run.status!==last){last=run.status;L('الحالة: '+run.status)}if(run.status==='completed')break}}
if(!run||run.status!=='completed')throw new Error('انتهى الوقت، راجع تبويب Actions في GitHub');
if(run.conclusion!=='success'){$('res').innerHTML=`<a class="dl" style="background:#c0392b" href="${run.html_url}" target="_blank">فشل البناء، افتح السجل</a>`;throw new Error('فشل البناء: '+run.conclusion)}
let rel=null;for(let i=0;i<10&&!rel;i++){rel=await gh(`/repos/${R}/releases/tags/v${run.run_number}`);if(!rel)await sleep(2000)}
if(!rel||!rel.assets.length)throw new Error('لم أجد ملف APK في Releases');

try{const r=await fetch(`https://api.github.com/repos/${R}/releases/assets/${as.id}`,{headers:{Authorization:'Bearer '+tok,Accept:'application/octet-stream'}});if(!r.ok)throw 0;const a=$('dl');a.href=URL.createObjectURL(await r.blob());a.download='app.apk';a.textContent='⬇️ تحميل APK'}catch(e){$('dl').textContent='تعذر التجهيز، استخدم الرابط البديل'}
}
}catch(e){L('❌ '+e.message)}
$('go').disabled=false};
</script></body></html>
