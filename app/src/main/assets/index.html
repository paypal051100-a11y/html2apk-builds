<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>(function(){function f(){var b=document.body;if(!b||!b.children.length)return;var H=window.innerHeight||Math.round(screen.height/(window.devicePixelRatio||1));if(H>0&&b.getBoundingClientRect().height<50){document.documentElement.style.height=H+"px";b.style.height=H+"px"}}window.addEventListener("load",function(){f();setTimeout(f,300);setTimeout(f,1200)});window.addEventListener("resize",f)})()</script><script>window.onerror=function(m,u,l,c){var d=document.createElement("div");d.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#c00;color:#fff;font:12px monospace;padding:8px;direction:ltr;white-space:pre-wrap";d.textContent="JS: "+m+" (line "+l+")";(document.body||document.documentElement).appendChild(d)};window.addEventListener("load",function(){var e=document.body.getBoundingClientRect(),d=document.createElement("div");d.style.cssText="position:fixed;left:0;top:0;z-index:99999;background:#000a;color:#0f0;font:11px monospace;padding:3px;direction:ltr";d.textContent="body "+Math.round(e.width)+"x"+Math.round(e.height)+" win "+innerWidth+"x"+innerHeight;document.documentElement.appendChild(d)})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>توزيع المحلات</title>
<style>
:root{--bg:#fdf6ef;--card:#fff;--line:#d9d4cf;--ink:#1f3a5f;--head:#111;--blue:#5b9bd5;--green:#3f9a52;--red:#d9534f;--muted:#8a8a8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1a17;--card:#2a2622;--line:#4a443e;--ink:#cfe3fa;--head:#f2ece6;--muted:#a69f98;--green:#6cc47e}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--head);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;padding:16px;max-width:600px;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px}
input{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 8px;width:100%;min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;border:1.5px solid var(--line)}
th,td{border:1.5px solid var(--line);padding:8px 5px;text-align:center;vertical-align:middle}
th{font-size:16px;padding:12px 4px}
td.n input{font-weight:700;font-size:19px;text-align:right;direction:ltr}
td.st{min-width:96px}
.rec{display:flex;gap:6px;justify-content:center;align-items:center}
.rec button{border:0;border-radius:50%;width:44px;height:44px;font-size:20px;line-height:1;cursor:pointer;background:var(--blue);color:#fff;padding:0}
.rec .play{background:var(--green)}
.rec .mic.on{background:var(--red);animation:pulse 1s infinite}
.rec .del{background:transparent;border:1.5px solid var(--red);width:34px;height:34px;font-size:15px}
@keyframes pulse{50%{opacity:.55}}
.ok{color:var(--green)}.owe{color:var(--red)}.old{color:var(--blue)}
.add,.share,.clear{display:block;border:0;border-radius:10px;font:inherit;font-size:18px;color:#fff;padding:14px 22px;cursor:pointer}
.add{background:var(--blue);margin:12px 0 0}
.sum{margin:24px 0;display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between;font-size:18px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.sum b{direction:ltr}
#cash{font-size:28px;font-weight:700;color:var(--green)}
.share{background:#5aae6a;width:100%;margin-bottom:12px}
.clear{background:transparent;color:var(--red);border:1.5px solid var(--red);width:100%;font-size:16px;margin-bottom:10px}
#clearNums{color:var(--blue);border-color:var(--blue)}

.dlg-bg{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(15,23,35,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s}
.dlg-bg.open{opacity:1;pointer-events:auto}
.dlg{width:100%;max-width:340px;background:var(--card);color:var(--head);border-radius:24px;padding:28px 22px 18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);transform:translateY(16px) scale(.94);transition:transform .22s cubic-bezier(.2,.9,.3,1.2)}
.dlg-bg.open .dlg{transform:none}
.dlg-ic{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;background:rgba(91,155,213,.16);color:var(--blue)}
.dlg-ic.ok{background:rgba(63,154,82,.16);color:var(--green)}
.dlg-ic.bad{background:rgba(217,83,79,.14);color:var(--red)}
.dlg-msg{font-size:19px;font-weight:600;line-height:1.6;margin:0 0 22px}
.dlg-btns{display:flex;gap:10px}
.dlg-btns button{flex:1;border:0;border-radius:14px;font:inherit;font-size:17px;font-weight:600;padding:13px 10px;cursor:pointer;color:#fff;background:var(--blue)}
.dlg-btns button.sec{background:rgba(128,128,128,.15);color:var(--head)}
.dlg-btns button.danger{background:var(--red)}
.dlg-btns button:active{transform:scale(.97)}
.dots span{display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 3px;background:#bbb;vertical-align:middle}
.dots.ok span{background:#3fbf5a;box-shadow:0 0 8px #3fbf5a}
.dots.wait span{background:#f0a030;animation:pulse 1s infinite}
.dots.bad span{background:var(--red)}
#autoSt{display:flex;align-items:center;justify-content:center;gap:8px}
</style>
</head>
<body>
<h1>توزيع المحلات</h1>
<div class="wrap">
<table>
<thead><tr><th>المحل</th><th>الجاج (₪)</th><th>المدفوع (₪)</th><th>ملاحظة</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>

<button class="share" id="sendLive" style="background:#3a78b8">📡 إرسال للتلفون الثاني</button>
<div id="autoSt" style="font-size:14px;color:var(--muted);min-height:24px;margin:-4px 0 10px"><span class="dots" id="dots"><span></span><span></span><span></span></span><span id="stTxt"></span></div>
<button class="clear" id="clear">🗑️ مسح الكل (الأسماء والأرقام)</button>

<div class="dlg-bg" id="dlgBg"><div class="dlg" role="alertdialog" aria-modal="true"><div class="dlg-ic" id="dlgIc"></div><p class="dlg-msg" id="dlgMsg"></p><div class="dlg-btns" id="dlgBtns"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
var dlgBg=document.getElementById('dlgBg');
function dlgOpen(icon,kind,msg,buttons){
 var ic=document.getElementById('dlgIc');ic.textContent=icon;ic.className='dlg-ic '+kind;
 document.getElementById('dlgMsg').textContent=msg;
 var bx=document.getElementById('dlgBtns');bx.innerHTML='';
 buttons.forEach(function(b){var e=document.createElement('button');e.textContent=b.t;e.className=b.c||'';
  e.onclick=function(){dlgBg.classList.remove('open');if(b.f)b.f()};bx.appendChild(e)});
 dlgBg.classList.add('open');bx.lastChild.focus()}
function note(msg,kind){dlgOpen(kind==='ok'?'✓':kind==='bad'?'!':'ℹ',kind||'',msg,[{t:'تمام'}])}
function ask(msg,yes,label){dlgOpen('🗑','bad',msg,[{t:'إلغاء',c:'sec'},{t:label||'حذف',c:'danger',f:yes}])}
</script>
<script>
var KEY='mahallat_v1', rows=[], tb=document.getElementById('rows');
function blank(){return{shop:'',gas:'',paid:'',audio:''}}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)rows=s}catch(e){}
while(rows.length<3)rows.push(blank())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}}
function lat(v){return String(v).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/٫/g,'.')}
function rd(x){return Math.round(x*100)/100}
function used(r){return r.shop.trim()!==''||String(r.gas).trim()!==''||String(r.paid).trim()!==''||!!r.audio}

/* قراءة الأرقام المكتوبة أو المحكية (1200 أو "ألف ومئتين") */
var W={احدعش:11,اثنعش:12,طنعش:12,تلطعش:13,ثلطعش:13,تلتعش:13,اربعطعش:14,اربعتعش:14,خمستعش:15,ستعش:16,سبعتعش:17,تمنتعش:18,ثمنتعش:18,تسعتعش:19,تمن:8,ثمان:8,الفين:2000,صفر:0,واحد:1,وحده:1,اثنين:2,اثنان:2,ثنتين:2,تنتين:2,ثلاثه:3,ثلاث:3,تلاته:3,تلات:3,اربعه:4,اربع:4,خمسه:5,خمس:5,سته:6,ست:6,ستيه:6,سبعه:7,سبع:7,ثمانيه:8,ثماني:8,تمانيه:8,تمان:8,تسعه:9,تسع:9,عشره:10,عشر:10,عشرين:20,ثلاثين:30,تلاتين:30,اربعين:40,خمسين:50,ستين:60,سبعين:70,ثمانين:80,تمانين:80,تسعين:90,ميتين:200,نص:0.5,نصف:0.5};
var H={مئه:100,ميه:100,مايه:100,الف:1000,الاف:1000};
function nm(w){return w.replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ذ/g,'د').replace(/ئ/g,'ي').replace(/ؤ/g,'و')}
function val(w){if(/^[0-9.]+$/.test(w))return parseFloat(w);if(W.hasOwnProperty(w))return W[w];
 var sf=['مايه','ميه'];for(var i=0;i<2;i++){var s=sf[i];if(w.length>s.length&&w.slice(-s.length)===s){var p=W[w.slice(0,-s.length)];if(p>=3&&p<=9)return p*100}}return null}
function known(w){w=nm(w);return val(w)!==null||H.hasOwnProperty(w)}
function parseNum(text){
 var s=String(text).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/([0-9])[,٬]([0-9])/g,'$1$2').replace(/[،,؟?٬]/g,' ').trim();
 var tk=s.split(/ +/),cur=null;
 for(var i=0;i<tk.length;i++){
  var w=nm(tk[i]),cont=false;
  if(w.length>2&&w.charAt(0)==='و'&&known(w.slice(1))){w=w.slice(1);cont=true}
  if(!known(w)){if(cur!==null)break;continue}
  if(H.hasOwnProperty(w)){cur=(cur!==null&&cur>0&&cur<10)?cur*H[w]:(cur||0)+H[w];continue}
  var v=val(w);
  if(cur===null)cur=v;else if(cont||v===0.5)cur+=v;else break}
 return cur}
function toNum(v){var n=parseNum(v);return n===null?0:n}

function fmtStatus(r){
 if(String(r.gas).trim()===''&&String(r.paid).trim()==='')return{t:'',c:''};
 var d=rd(toNum(r.paid)-toNum(r.gas));
 if(d===0)return{t:'✔ دفع حق الجاج',c:'ok'};
 if(d<0)return{t:'باقي عليه '+(-d),c:'owe'};
 return{t:'سدد من العتيق '+d,c:'old'}}
function totals(){}
function addRow(r){
 var tr=document.createElement('tr');
 tr.innerHTML='<td class="shop"><input type="text" aria-label="المحل">'+'</td>'+
 '<td class="n"><input type="text" inputmode="decimal" lang="en" dir="ltr" aria-label="الجاج"></td>'+
 '<td class="n"><input type="text" inputmode="decimal" lang="en" dir="ltr" aria-label="المدفوع"></td>'+
 '<td class="st"></td>';
 var ins=tr.querySelectorAll('input'),st=tr.querySelector('.st'),player=null,recorder=null;
 var sh=ins[0],ga=ins[1],pa=ins[2];
 sh.value=r.shop;ga.value=lat(r.gas);pa.value=lat(r.paid);
 function btn(cls,txt,label,fn){var b=document.createElement('button');b.type='button';b.className=cls;b.textContent=txt;b.setAttribute('aria-label',label);b.onclick=fn;return b}
 function stopPlay(){if(player){player.pause();player=null}}
 function show(){
  st.innerHTML='';var box=document.createElement('div');box.className='rec';st.appendChild(box);
  if(recorder){box.appendChild(btn('mic on','⏹','إيقاف التسجيل',function(){recorder.stop()}));return}
  if(r.audio){
   box.appendChild(btn('play',player?'⏸':'▶','تشغيل التسجيل',function(){
    if(player){stopPlay();show();return}
    player=new Audio(r.audio);player.onended=function(){player=null;show()};
    player.play().catch(function(){player=null;show()});show()}));
   box.appendChild(btn('del','🗑','حذف التسجيل',function(){
    ask('حذف التسجيل؟',function(){stopPlay();r.audio='';save();show();autoSend()})}));
   return}
  box.appendChild(btn('mic','🎤','تسجيل صوتي',startRec))}
 function startRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder){note('التسجيل الصوتي غير مدعوم هنا','bad');return}
  stopPlay();
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
   var chunks=[],mr;
   try{mr=new MediaRecorder(stream,{audioBitsPerSecond:24000})}catch(e){mr=new MediaRecorder(stream)}
   mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
   mr.onstop=function(){
    stream.getTracks().forEach(function(t){t.stop()});recorder=null;
    var fr=new FileReader();
    fr.onload=function(){r.audio=fr.result;save();show();autoSend();
     if(used(rows[rows.length-1])){var n=blank();rows.push(n);addRow(n)}};
    fr.readAsDataURL(new Blob(chunks,{type:mr.mimeType||'audio/webm'}))};
   recorder=mr;mr.start();show()
  }).catch(function(){note('ما قدرت أشغل المايك. تأكد من السماح بالميكروفون.','bad')})}
 function upd(){
  [ga,pa].forEach(function(i){var v=lat(i.value);if(v!==i.value)i.value=v});
  r.shop=sh.value;r.gas=ga.value;r.paid=pa.value;show();
  if(used(rows[rows.length-1])){var n=blank();rows.push(n);addRow(n)}
  totals();save();autoSend()}
 function fix(inp){return function(){var n=parseNum(inp.value);if(n!==null)inp.value=n;upd()}}
 sh.oninput=ga.oninput=pa.oninput=upd;
 ga.onchange=fix(ga);pa.onchange=fix(pa);
 show();tb.appendChild(tr)}
document.getElementById('clear').onclick=function(){
 ask('مسح الأسماء والأرقام كلها؟',function(){
 rows=[];try{localStorage.removeItem(KEY)}catch(e){}
 tb.innerHTML='';while(rows.length<3)rows.push(blank());rows.forEach(addRow);totals()},'مسح الكل')};

var TOPIC='tawzi3/9ef8537b115609ee8e24';
var BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
function mqttSend(list,done){
 var sentAt=new Date().toISOString(),batch=Date.now().toString(36),pend=BROKERS.length,ok=0,called=false;
 function fire(g){if(!called&&(g||pend===0)){called=true;done(g)}}
 BROKERS.forEach(function(url){
  var c,fin=false;
  function end(g){if(fin)return;fin=true;pend--;if(g)ok++;try{c.end(true)}catch(e){}fire(g?true:ok>0)}
  try{c=mqtt.connect(url,{clientId:'tz_'+Math.random().toString(16).slice(2,10),clean:true,reconnectPeriod:0,connectTimeout:8000})}catch(e){end(false);return}
  c.on('connect',function(){var n=0;
   list.forEach(function(r,k){
    c.publish(TOPIC+'/r/'+k,JSON.stringify({batch:batch,count:list.length,sentAt:sentAt,i:k,shop:r.shop,gas:r.gas,paid:r.paid,audio:r.audio}),{qos:1,retain:true},function(err){
     if(err){end(false);return}if(++n===list.length)end(true)})})});
  c.on('error',function(){end(false)});
  setTimeout(function(){end(false)},20000)})}
function buildList(){return rows.filter(used).map(function(r){var a=r.audio||'';if(a.length>500000)a='';return{shop:r.shop,gas:toNum(r.gas),paid:toNum(r.paid),audio:a}})}
var DK=KEY+'_dirty',ver=0,autoTimer=null,busy=false,again=false,dotsEl=document.getElementById('dots'),txtEl=document.getElementById('stTxt');
function isDirty(){try{return localStorage.getItem(DK)==='1'}catch(e){return false}}
function setDirty(v){try{v?localStorage.setItem(DK,'1'):localStorage.removeItem(DK)}catch(e){}}
function setSt(k,t){dotsEl.className='dots '+k;txtEl.textContent=t}
function loadMqtt(cb){
 if(typeof mqtt!=='undefined'){cb(true);return}
 var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js';
 sc.onload=function(){cb(typeof mqtt!=='undefined')};sc.onerror=function(){cb(false)};document.head.appendChild(sc)}
function fail(){setSt('bad',navigator.onLine===false?'بدون نت — بينرسل أول ما يرجع':'⚠️ ما انرسل — بيعيد المحاولة لحاله')}
var NATIVE=!!(window.Android&&typeof Android.queueSync==='function'&&typeof Android.syncPending==='function');
function handOver(){
 var list=buildList();
 if(!list.length){setDirty(false);refreshSt();return}
 var batch=Date.now().toString(36),at=new Date().toISOString();
 var pl=list.map(function(r,k){return JSON.stringify({batch:batch,count:list.length,sentAt:at,i:k,shop:r.shop,gas:r.gas,paid:r.paid,audio:r.audio})});
 try{Android.queueSync(TOPIC,JSON.stringify(pl),batch);setDirty(false)}catch(e){setSt('bad','⚠️ تعذر التسليم للإرسال');return}
 refreshSt()}
function refreshSt(){
 if(isDirty()){setSt('wait','⏳ …');return}
 var p=false;try{p=Android.syncPending()}catch(e){}
 if(p)setSt(navigator.onLine===false?'bad':'wait',navigator.onLine===false?'بدون نت — بينرسل أول ما يرجع':'جاري الإرسال…');
 else setSt('ok','✓ كله انرسل')}
if(NATIVE)setInterval(refreshSt,1500);
function sync(){
 clearTimeout(autoTimer);
 if(NATIVE){handOver();return}
 if(busy){again=true;return}
 var list=buildList();
 if(!list.length){setDirty(false);setSt('ok','✓ كله انرسل');return}
 if(navigator.onLine===false){fail();return}
 busy=true;var v=ver;setSt('wait','جاري الإرسال…');
 loadMqtt(function(loaded){
  if(!loaded){busy=false;fail();return}
  mqttSend(list,function(ok){busy=false;
   if(ok){if(v===ver){setDirty(false);setSt('ok','✓ كله انرسل')}else again=true}else fail();
   if(again){again=false;sync()}})})}
function autoSend(){ver++;setDirty(true);setSt('wait','⏳ …');clearTimeout(autoTimer);autoTimer=setTimeout(sync,900)}
document.getElementById('sendLive').onclick=function(){
 if(NATIVE){handOver();note('تم تسليم المعلومات للإرسال','ok');return}
 var list=buildList();
 if(!list.length){note('ما في شي للإرسال');return}
 var b=this,v=ver;b.disabled=true;b.textContent='جاري الإرسال…';
 loadMqtt(function(loaded){
  if(!loaded){b.disabled=false;b.textContent='📡 إرسال للتلفون الثاني';note('تعذّر تحميل مكتبة الاتصال. تأكد من الإنترنت.','bad');return}
  mqttSend(list,function(ok){b.disabled=false;b.textContent='📡 إرسال للتلفون الثاني';
   if(ok){if(v===ver){setDirty(false);setSt('ok','✓ كله انرسل')}note('تم الإرسال','ok')}else note('فشل الإرسال. تأكد من الإنترنت.','bad')})})};
function pending(){if(isDirty()&&!busy)sync()}
window.addEventListener('online',pending);
document.addEventListener('visibilitychange',function(){if(!document.hidden)pending()});
setInterval(pending,15000);
function initSync(){if(isDirty())sync();else if(NATIVE)refreshSt();else setSt('ok','✓ كله انرسل')}
load();rows.forEach(addRow);
if(used(rows[rows.length-1])){var n0=blank();rows.push(n0);addRow(n0)}
totals();initSync();
</script>
</body>
</html>
