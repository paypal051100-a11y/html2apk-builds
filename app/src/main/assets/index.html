<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>(function(){function f(){var b=document.body;if(!b||!b.children.length)return;var H=window.innerHeight||Math.round(screen.height/(window.devicePixelRatio||1));if(H>0&&b.getBoundingClientRect().height<50){document.documentElement.style.height=H+"px";b.style.height=H+"px"}}window.addEventListener("load",function(){f();setTimeout(f,300);setTimeout(f,1200)});window.addEventListener("resize",f)})()</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>توزيع المحلات</title>
<style>
:root{--bg:#fdf6ef;--card:#fff;--line:#d9d4cf;--ink:#1f3a5f;--head:#111;--blue:#5b9bd5;--green:#3f9a52;--red:#d9534f;--muted:#8a8a8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1a17;--card:#2a2622;--line:#4a443e;--ink:#cfe3fa;--head:#f2ece6;--muted:#a69f98;--green:#6cc47e}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--head);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;padding:16px;max-width:600px;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px}
input{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 8px;width:100%;min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;border:1.5px solid var(--line)}
th,td{border:1.5px solid var(--line);padding:8px 5px;text-align:center;vertical-align:middle}
th{font-size:16px;padding:12px 4px}
td.n input{font-weight:700;font-size:19px;text-align:right;direction:ltr}
td.st{font-size:14px;font-weight:700;min-width:78px}
.ok{color:var(--green)}.owe{color:var(--red)}.old{color:var(--blue)}
.add,.share,.clear{display:block;border:0;border-radius:10px;font:inherit;font-size:18px;color:#fff;padding:14px 22px;cursor:pointer}
.add{background:var(--blue);margin:12px 0 0}
.sum{margin:24px 0;display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between;font-size:18px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.sum b{direction:ltr}
#cash{font-size:28px;font-weight:700;color:var(--green)}
.share{background:#5aae6a;width:100%;margin-bottom:12px}
.clear{background:transparent;color:var(--red);border:1.5px solid var(--red);width:100%;font-size:16px;margin-bottom:10px}
#clearNums{color:var(--blue);border-color:var(--blue)}
</style>
</head>
<body>
<h1>توزيع المحلات</h1>
<div class="wrap">
<table>
<thead><tr><th>المحل</th><th>الجاج (₪)</th><th>المدفوع (₪)</th><th>الحالة</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>

<div class="sum">
<div id="cash"><span>المقبوض:</span><b id="vCash">0</b></div>
<div><span>قيمة الجاج الموزع</span><b id="vGas">0</b></div>
</div>

<button class="share" id="share">📤 مشاركة كصورة</button>
<button class="clear" id="clearNums">🔄 مسح الأرقام فقط (الأسماء تبقى)</button>
<button class="clear" id="clear">🗑️ مسح الكل (الأسماء والأرقام)</button>

<script>
var KEY='mahallat_v1', rows=[], tb=document.getElementById('rows');
function blank(){return{shop:'',gas:'',paid:''}}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)rows=s}catch(e){}
while(rows.length<3)rows.push(blank())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}}
function lat(v){return String(v).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/٫/g,'.')}
function rd(x){return Math.round(x*100)/100}
function used(r){return r.shop.trim()!==''||String(r.gas).trim()!==''||String(r.paid).trim()!==''}

/* قراءة الأرقام المكتوبة أو المحكية (1200 أو "ألف ومئتين") */
var W={احدعش:11,اثنعش:12,طنعش:12,تلطعش:13,ثلطعش:13,تلتعش:13,اربعطعش:14,اربعتعش:14,خمستعش:15,ستعش:16,سبعتعش:17,تمنتعش:18,ثمنتعش:18,تسعتعش:19,تمن:8,ثمان:8,الفين:2000,صفر:0,واحد:1,وحده:1,اثنين:2,اثنان:2,ثنتين:2,تنتين:2,ثلاثه:3,ثلاث:3,تلاته:3,تلات:3,اربعه:4,اربع:4,خمسه:5,خمس:5,سته:6,ست:6,ستيه:6,سبعه:7,سبع:7,ثمانيه:8,ثماني:8,تمانيه:8,تمان:8,تسعه:9,تسع:9,عشره:10,عشر:10,عشرين:20,ثلاثين:30,تلاتين:30,اربعين:40,خمسين:50,ستين:60,سبعين:70,ثمانين:80,تمانين:80,تسعين:90,ميتين:200,نص:0.5,نصف:0.5};
var H={مئه:100,ميه:100,مايه:100,الف:1000,الاف:1000};
function nm(w){return w.replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ذ/g,'د').replace(/ئ/g,'ي').replace(/ؤ/g,'و')}
function val(w){if(/^[0-9.]+$/.test(w))return parseFloat(w);if(W.hasOwnProperty(w))return W[w];
 var sf=['مايه','ميه'];for(var i=0;i<2;i++){var s=sf[i];if(w.length>s.length&&w.slice(-s.length)===s){var p=W[w.slice(0,-s.length)];if(p>=3&&p<=9)return p*100}}return null}
function known(w){w=nm(w);return val(w)!==null||H.hasOwnProperty(w)}
function parseNum(text){
 var s=String(text).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/([0-9])[,٬]([0-9])/g,'$1$2').replace(/[،,؟?٬]/g,' ').trim();
 var tk=s.split(/ +/),cur=null;
 for(var i=0;i<tk.length;i++){
  var w=nm(tk[i]),cont=false;
  if(w.length>2&&w.charAt(0)==='و'&&known(w.slice(1))){w=w.slice(1);cont=true}
  if(!known(w)){if(cur!==null)break;continue}
  if(H.hasOwnProperty(w)){cur=(cur!==null&&cur>0&&cur<10)?cur*H[w]:(cur||0)+H[w];continue}
  var v=val(w);
  if(cur===null)cur=v;else if(cont||v===0.5)cur+=v;else break}
 return cur}
function toNum(v){var n=parseNum(v);return n===null?0:n}

function fmtStatus(r){
 if(String(r.gas).trim()===''&&String(r.paid).trim()==='')return{t:'',c:''};
 var d=rd(toNum(r.paid)-toNum(r.gas));
 if(d===0)return{t:'✔ دفع حق الجاج',c:'ok'};
 if(d<0)return{t:'باقي عليه '+(-d),c:'owe'};
 return{t:'سدد من العتيق '+d,c:'old'}}
function totals(){
 var gas=0,cash=0;
 rows.forEach(function(r){gas+=toNum(r.gas);cash+=toNum(r.paid)});
 document.getElementById('vGas').textContent=rd(gas);
 document.getElementById('vCash').textContent=rd(cash)+' شيكل';
 return{gas:rd(gas),cash:rd(cash)}}
function addRow(r){
 var tr=document.createElement('tr');
 tr.innerHTML='<td class="shop"><input type="text" aria-label="المحل" placeholder="اسم المحل">'+'</td>'+
 '<td class="n"><input type="text" inputmode="decimal" lang="en" dir="ltr" aria-label="الجاج"></td>'+
 '<td class="n"><input type="text" inputmode="decimal" lang="en" dir="ltr" aria-label="المدفوع"></td>'+
 '<td class="st"></td>';
 var ins=tr.querySelectorAll('input'),st=tr.querySelector('.st');
 var sh=ins[0],ga=ins[1],pa=ins[2];
 sh.value=r.shop;ga.value=lat(r.gas);pa.value=lat(r.paid);
 function show(){var s=fmtStatus(r);st.textContent=s.t;st.className='st '+s.c}
 function upd(){
  [ga,pa].forEach(function(i){var v=lat(i.value);if(v!==i.value)i.value=v});
  r.shop=sh.value;r.gas=ga.value;r.paid=pa.value;show();
  if(used(rows[rows.length-1])){var n=blank();rows.push(n);addRow(n)}
  totals();save()}
 function fix(inp){return function(){var n=parseNum(inp.value);if(n!==null)inp.value=n;upd()}}
 sh.oninput=ga.oninput=pa.oninput=upd;
 ga.onchange=fix(ga);pa.onchange=fix(pa);
 show();tb.appendChild(tr)}
function hasNums(r){return String(r.gas).trim()!==''||String(r.paid).trim()!==''}
function buildImage(){
 var list=rows.filter(hasNums),t=totals();
 var W=900,pad=30,R=W-pad,rh=84,hh=84,top=100,foot=170,S=2;
 var H=top+hh+rh*list.length+foot;
 var c=document.createElement('canvas');c.width=W*S;c.height=H*S;
 var x=c.getContext('2d');x.scale(S,S);x.direction='rtl';x.textBaseline='middle';
 var F='"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif';
 x.fillStyle='#fdf6ef';x.fillRect(0,0,W,H);
 x.fillStyle='#111';x.font='bold 36px '+F;x.textAlign='right';x.fillText('توزيع المحلات',R,48);
 var d=new Date();x.font='24px '+F;x.fillStyle='#8a8a8a';x.textAlign='left';
 x.fillText(d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear(),pad,48);
 var cw=[230,170,170,270],ed=[R],i;
 for(i=0;i<4;i++)ed.push(ed[i]-cw[i]);
 function cell(txt,ci,y,h,font,color){
  var cx=(ed[ci]+ed[ci+1])/2,sz=parseInt(font.match(/\d+/)[0]),f=font;
  x.font=f;while(x.measureText(txt).width>cw[ci]-14&&sz>12){sz--;f=font.replace(/\d+px/,sz+'px');x.font=f}
  x.fillStyle=color;x.textAlign='center';x.fillText(txt,cx,y+h/2)}
 var y=top;
 x.fillStyle='#f0e9e1';x.fillRect(pad,y,W-2*pad,hh);
 ['المحل','الجاج (₪)','المدفوع (₪)','الحالة'].forEach(function(h,k){cell(h,k,y,hh,'bold 28px '+F,'#111')});
 y+=hh;
 var col={ok:'#3f9a52',owe:'#d9534f',old:'#3a78b8','':'#111'};
 list.forEach(function(r){
  var s=fmtStatus(r);
  x.fillStyle='#fff';x.fillRect(pad,y,W-2*pad,rh);
  cell(r.shop||'محل',0,y,rh,'bold 28px '+F,'#1f3a5f');
  cell(String(r.gas).trim()===''?'':String(rd(toNum(r.gas))),1,y,rh,'bold 30px '+F,'#1f3a5f');
  cell(String(r.paid).trim()===''?'':String(rd(toNum(r.paid))),2,y,rh,'bold 30px '+F,'#1f3a5f');
  cell(s.t,3,y,rh,'bold 22px '+F,col[s.c]);
  y+=rh});
 x.strokeStyle='#d9d4cf';x.lineWidth=2;
 var th=hh+rh*list.length;
 x.strokeRect(pad,top,W-2*pad,th);
 for(i=1;i<4;i++){x.beginPath();x.moveTo(ed[i],top);x.lineTo(ed[i],top+th);x.stroke()}
 for(i=0;i<=list.length;i++){x.beginPath();x.moveTo(pad,top+hh+rh*i-(i?0:0));x.lineTo(R,top+hh+rh*i);x.stroke()}
 y+=50;x.textAlign='right';
 x.font='bold 42px '+F;x.fillStyle='#3f9a52';x.fillText('المقبوض: '+t.cash+' شيكل',R,y+10);
 x.font='30px '+F;x.fillStyle='#111';x.fillText('قيمة الجاج الموزع: '+t.gas,R,y+75);
 return c}
function showImg(url){
 var o=document.createElement('div');
 o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;overflow:auto;padding:16px;text-align:center';
 o.innerHTML='<img src="'+url+'" style="width:100%;max-width:600px;border-radius:8px"><p style="color:#fff">اضغط مطولاً على الصورة واحفظها، أو اعمل لها لقطة شاشة</p><button style="font:inherit;padding:10px 24px;border-radius:8px;border:0">إغلاق</button>';
 o.querySelector('button').onclick=function(){o.remove()};document.body.appendChild(o)}
document.getElementById('share').onclick=function(){
 if(!rows.some(hasNums)){alert('ما في أرقام للمشاركة');return}
 var c=buildImage();
 c.toBlob(function(b){
  var f=null;try{f=new File([b],'tawzi3.png',{type:'image/png'})}catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
   navigator.share({files:[f],title:'توزيع المحلات'}).catch(function(){})}
  else showImg(c.toDataURL('image/png'))},'image/png')};
document.getElementById('clearNums').onclick=function(){
 if(!confirm('مسح الأرقام فقط وإبقاء أسماء المحلات؟'))return;
 rows.forEach(function(r){r.gas='';r.paid=''});save();
 tb.innerHTML='';rows.forEach(addRow);totals()};
document.getElementById('clear').onclick=function(){
 if(!confirm('مسح الأسماء والأرقام كلها؟'))return;
 rows=[];try{localStorage.removeItem(KEY)}catch(e){}
 tb.innerHTML='';while(rows.length<3)rows.push(blank());rows.forEach(addRow);totals()};
load();rows.forEach(addRow);
if(used(rows[rows.length-1])){var n0=blank();rows.push(n0);addRow(n0)}
totals();
</script>
</body>
</html>
