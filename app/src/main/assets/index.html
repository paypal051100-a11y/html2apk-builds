<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#202124">
<title>حاسبة الوزن</title>
<style>
:root{--bg:#17181b;--panel:#2b2d31;--key:#393c40;--blue:#d7e3ff;--blueText:#173b78;--text:#f7f7f8;--muted:#b9bbc2}
*{box-sizing:border-box}body{margin:0;background:#f0f1f3;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);display:flex;justify-content:center;min-height:100vh;padding:10px}
.app{width:min(100%,480px);background:linear-gradient(#26272a,#1c1d20);border-radius:30px;padding:22px 18px 24px;box-shadow:0 10px 35px #0002;align-self:flex-start}
header{display:flex;justify-content:space-between;align-items:center;margin:0 5px 20px;font-size:28px;font-weight:750}
header span{font-size:25px}
.display{background:#2d2f33;border-radius:24px;padding:16px;margin-bottom:16px}
.caption{color:var(--muted);font-size:14px;margin:0 0 10px}
.preview{height:150px;border-radius:16px;background:#44464b;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;text-align:center;color:#ddd}
.preview img{width:100%;height:100%;object-fit:contain;display:none;background:#222}
.placeholder{padding:12px}.placeholder .ico{font-size:35px;display:block;margin-bottom:8px}
.placeholder strong{display:block;font-size:17px;font-weight:600}.placeholder small{display:block;color:#c6c7cc;margin-top:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.action{border:0;border-radius:13px;padding:12px 8px;font-size:15px;font-weight:700;background:var(--blue);color:var(--blueText);cursor:pointer}
.action.secondary{background:#414348;color:white}.action:active,.key:active{filter:brightness(.9);transform:scale(.99)}
.reading{display:flex;align-items:baseline;gap:8px;margin-top:15px;direction:ltr;justify-content:flex-end}
#result{font-size:clamp(42px,12vw,62px);font-weight:750;line-height:1.2;min-width:0;width:100%;background:transparent;border:0;color:white;outline:none;text-align:left}
.unit{font-size:16px;color:#d1d2d7}
.status{font-size:12px;color:#bfc1c8;margin-top:4px;min-height:18px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;direction:ltr}
.key{height:64px;border:0;border-radius:20px;background:var(--key);color:white;font-size:27px;font-weight:650;cursor:pointer}
.key.op,.key.equal{background:var(--blue);color:var(--blueText)}
.key.small{font-size:22px}
.note{color:#b9bbc2;font-size:12px;text-align:center;margin:17px 0 0}
input[type=file]{display:none}
@media(max-width:360px){.app{padding:17px 12px}.key{height:57px;border-radius:16px}.preview{height:130px}}
</style>
</head>
<body>
<main class="app">
<header><span aria-hidden="true">▦</span><div>حاسبة الوزن</div></header>
<section class="display">
<p class="caption">الصورة المرفوعة من المعرض</p>
<div class="preview">
<img id="photo" alt="الصورة المختارة">
<div class="placeholder" id="placeholder"><span class="ico">▧</span><strong>اختاري صورة يظهر فيها الوزن</strong><small>يمكنك رفع صورة أو فتح الكاميرا مباشرة</small></div>
</div>
<div class="actions">
<button class="action" id="galleryBtn">تحميل صورة</button>
<button class="action secondary" id="cameraBtn">📷 تصوير الوزن</button>
</div>
<input id="gallery" type="file" accept="image/*">
<input id="camera" type="file" accept="image/*" capture="environment">
<div class="reading"><input id="result" inputmode="decimal" aria-label="الوزن" value="0" autocomplete="off"><span class="unit">كغم</span></div>
<div class="status" id="status">أدخلي الوزن يدويًا أو حاولي قراءته من الصورة.</div>
</section>
<section class="keypad" aria-label="لوحة الحاسبة">
<button class="key op" data-action="divide">÷</button>
<button class="key" data-action="percent">%</button>
<button class="key small" data-action="back">⌫</button>
<button class="key small" data-action="clear">AC</button>
<button class="key" data-num="7">7</button><button class="key" data-num="8">8</button><button class="key" data-num="9">9</button><button class="key op" data-action="multiply">×</button>
<button class="key" data-num="4">4</button><button class="key" data-num="5">5</button><button class="key" data-num="6">6</button><button class="key op" data-action="subtract">−</button>
<button class="key" data-num="1">1</button><button class="key" data-num="2">2</button><button class="key" data-num="3">3</button><button class="key op" data-action="add">+</button>
<button class="key op" data-action="sign">±</button><button class="key" data-num="0">0</button><button class="key" data-action="dot">.</button><button class="key equal" data-action="equals">=</button>
</section>
<p class="note">ترتيب الأرقام إنجليزي مثل الحاسبة العادية • يمكنك تعديل الوزن بعد إدخاله</p>
</main>
<script>
const result=document.getElementById('result'),statusEl=document.getElementById('status');
const gallery=document.getElementById('gallery'),camera=document.getElementById('camera'),photo=document.getElementById('photo'),placeholder=document.getElementById('placeholder');
let stored=0, pending=null, fresh=true;
function current(){const n=parseFloat(result.value.replace(/,/g,''));return Number.isFinite(n)?n:0}
function show(n){result.value=String(Number.isFinite(n)?Number(n.toFixed(8)):0)}
document.getElementById('galleryBtn').onclick=()=>gallery.click();
document.getElementById('cameraBtn').onclick=()=>camera.click();
function handleFile(file){
 if(!file)return;
 const url=URL.createObjectURL(file);photo.src=url;photo.style.display='block';placeholder.style.display='none';
 statusEl.textContent='تم تحميل الصورة. جارٍ محاولة قراءة الرقم الظاهر...';
 // OCR is optional and loaded from the internet only when an image is selected.
 const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
 script.onload=async()=>{
  try{
   statusEl.textContent='جارٍ قراءة النص من الصورة...';
   const worker=await Tesseract.createWorker('eng');
   const {data}=await worker.recognize(file);await worker.terminate();
   const matches=(data.text||'').replace(/,/g,'.').match(/\d+(?:\.\d{1,3})?/g);
   if(matches&&matches.length){
    const nums=matches.map(Number).filter(Number.isFinite);
    const best=nums.sort((a,b)=>b-a)[0];
    show(best);statusEl.textContent='قراءة مبدئية من الصورة: '+best+' كغم. راجعي الرقم وعدّليه إذا لزم.';
   }else statusEl.textContent='لم أتمكن من تمييز رقم الوزن. اكتبيه من لوحة الأرقام.';
  }catch(e){statusEl.textContent='تعذرت القراءة التلقائية؛ اكتبي الوزن يدويًا من لوحة الأرقام.'}
 };
 script.onerror=()=>statusEl.textContent='ميزة القراءة التلقائية تحتاج اتصال إنترنت. يمكنك إدخال الوزن يدويًا.';
 document.head.appendChild(script);
}
gallery.onchange=e=>handleFile(e.target.files[0]);camera.onchange=e=>handleFile(e.target.files[0]);
document.querySelectorAll('.key').forEach(btn=>btn.addEventListener('click',()=>{
 const num=btn.dataset.num, action=btn.dataset.action;
 if(num!==undefined){if(fresh||result.value==='0'){result.value=num;fresh=false}else result.value+=num;return}
 switch(action){
 case 'clear':show(0);stored=0;pending=null;fresh=true;statusEl.textContent='تم مسح الحاسبة.';break;
 case 'back':result.value=result.value.length>1?result.value.slice(0,-1):'0';fresh=false;break;
 case 'dot':if(fresh){result.value='0.';fresh=false}else if(!result.value.includes('.'))result.value+='.';break;
 case 'sign':show(-current());break;
 case 'percent':show(current()/100);break;
 case 'add':case 'subtract':case 'multiply':case 'divide':stored=current();pending=action;fresh=true;break;
 case 'equals':
  if(pending){const b=current();let out=stored;if(pending==='add')out=stored+b;if(pending==='subtract')out=stored-b;if(pending==='multiply')out=stored*b;if(pending==='divide')out=b===0?NaN:stored/b;show(out);pending=null;fresh=true;statusEl.textContent=Number.isFinite(out)?'الناتج جاهز.':'لا يمكن القسمة على صفر.'}
  break;
 }
}));
result.addEventListener('input',()=>{fresh=false});
</script>
</body></html>
